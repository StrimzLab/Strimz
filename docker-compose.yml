# Strimz local development stack.
#
# Two profiles:
#   default        →  postgres + redis + anvil   (the daily "spin up
#                     infra and run apps via pnpm dev" workflow)
#   full           →  also boots api, scheduler, agent, indexer in
#                     containers, useful for end-to-end smoke testing
#                     a build artifact rather than the dev tree
#
# Usage
#   docker compose up -d                    # just infra
#   pnpm db:migrate                         # apply Prisma migrations
#   pnpm dev                                # run apps from your shell
#
#   docker compose --profile full up        # everything in containers
#                                           # (run migrations first)
#
# Service-to-service hostnames are the compose service names
# (`postgres`, `redis`, `anvil`). Apps run from your host should keep
# using `localhost` since the ports are published.
#
# Anvil runs a vanilla EVM dev chain (chain id 31337) on :8545. Swap
# the command for an Arc-flavoured one once Arc publishes a local node
# image — the rest of the stack does not need to change.

name: strimz

services:
  # ─────────── infra (always on) ───────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strimz
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d strimz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: unless-stopped
    # `anvil` defaults to localhost-only; we have to bind 0.0.0.0 so
    # other compose services and the host can reach it.
    entrypoint: ['anvil']
    command:
      - --host=0.0.0.0
      - --chain-id=31337
      - --block-time=2
    ports:
      - '8545:8545'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- --post-data=''{"jsonrpc":"2.0","method":"eth_blockNumber","id":1}'' --header=''Content-Type: application/json'' http://localhost:8545 | grep -q result',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────── apps (full profile only) ───────────
  #
  # These rebuild from local Dockerfiles. They assume migrations have
  # already been applied — run `pnpm db:migrate` against the postgres
  # service before bringing them up.

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # KMS_SOFTWARE_PRIVATE_KEY is a secret and must come from this env
    # file (or your hosting provider's vault in production). It is
    # never hardcoded in compose — the boot guard refuses to start in
    # production without it.
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_BASE_URL: http://localhost:4000
      CHECKOUT_ORIGIN: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/strimz?schema=public
      REDIS_URL: redis://redis:6379
      ARC_RPC_URL: http://anvil:8545
      ARC_ENVIRONMENT: testnet
      KMS_PROVIDER: software
    ports:
      - '4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/scheduler/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4200'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/strimz?schema=public
      REDIS_URL: redis://redis:6379
      ARC_RPC_URL: http://anvil:8545
      ARC_ENVIRONMENT: testnet
    ports:
      - '4200:4200'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  agent:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/agent/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4300'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/strimz?schema=public
      REDIS_URL: redis://redis:6379
      ARC_RPC_URL: http://anvil:8545
      ARC_ENVIRONMENT: testnet
    ports:
      - '4300:4300'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  indexer:
    profiles: [full]
    build:
      context: ./apps/indexer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/indexer/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/strimz?schema=public
      ARC_RPC_URL: http://anvil:8545
      ARC_ENVIRONMENT: testnet
      HTTP_PORT: '4100'
      LOG_LEVEL: info
    ports:
      - '4100:4100'
    depends_on:
      postgres: { condition: service_healthy }
      anvil: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
