; Strimz single-container process orchestration.
;
; Order matters: postgres + redis + nginx come up first (fast), then
; the four app services once the data plane is live. Supervisord
; runs them all as long-running foreground processes, restarting any
; that exit non-zero.
;
; Logs go to stdout/stderr so `docker logs` shows every service
; interleaved. If you want per-service logs, replace `stdout_logfile`
; with a real path under /var/log/supervisor/ (the dir exists).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

; ------- Data plane -------

[program:postgres]
command=su-exec postgres postgres -D /data/postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=INT
stopwaitsecs=30

[program:redis]
command=su-exec redis redis-server --dir /data/redis --appendonly yes --protected-mode no --bind 127.0.0.1
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ------- Front door -------

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ------- Application layer -------
;
; Each Node service reads its config from process.env; we let them
; share the container's env — vars with the same name (DATABASE_URL,
; REDIS_URL, ARC_*) resolve identically across processes.

[program:api]
command=node dist/main.js
directory=/repo/apps/api
environment=NODE_ENV=production,PORT=4000
autostart=true
autorestart=true
priority=30
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=node dist/src/main.js
directory=/repo/apps/scheduler
environment=NODE_ENV=production,PORT=4200
autostart=true
autorestart=true
priority=40
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; The agent is optional. On a 1 GB Lightsail box it's the first thing to
; drop when RAM is tight: set ENABLE_AGENT=false in the env to skip it.
; entrypoint.sh defaults ENABLE_AGENT=true so existing deploys are unchanged.
[program:agent]
command=node dist/src/main.js
directory=/repo/apps/agent
environment=NODE_ENV=production,PORT=4300
autostart=%(ENV_ENABLE_AGENT)s
autorestart=%(ENV_ENABLE_AGENT)s
priority=40
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:indexer]
command=/usr/local/bin/strimz-indexer run
# The Go indexer uses pgx, which rejects Prisma's `?schema=public` and needs
# TLS explicitly disabled for the local Postgres. Override just this process's
# DATABASE_URL; api/scheduler/agent keep the Prisma-style container URL.
environment=HTTP_PORT="4100",DATABASE_URL="postgresql://postgres@localhost:5432/strimz?sslmode=disable"
autostart=true
autorestart=true
priority=40
startsecs=3
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Supervisorctl socket — `docker exec -it <container> supervisorctl status`
; is the operator's tool for poking process state at runtime.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
