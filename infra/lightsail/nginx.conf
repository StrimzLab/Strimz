# Strimz single-container reverse proxy.
#
# Nginx fronts everything on :80 and routes to the API on :4000. The
# scheduler/agent/indexer live on internal ports and are never exposed
# to the internet — merchant traffic and public checkout traffic both
# talk to the API only.
#
# When we go multi-container we'll split this into per-service upstreams;
# for the single-container Lightsail demo, one upstream keeps the shape
# simple + still gives us the ability to intercept for health checks or
# static asset caching later.

user nginx;
worker_processes auto;
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic hardening.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Upstream logs get merged into `docker logs` because we redirect to
    # /dev/stdout below. `combined` is the standard access-log format;
    # remove this if you don't want the noise.
    access_log /dev/stdout;

    # File uploads (storefront logos + cover images travel through the
    # API on the way to UploadThing). 25 MB is comfortably above our
    # per-image caps but stops arbitrary large POSTs.
    client_max_body_size 25m;
    client_body_timeout 60s;

    upstream strimz_api {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # /nginx-health returns 200 as long as nginx itself is alive.
        # Lightsail's HTTP health check hits this.
        location = /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://strimz_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    75s;
            proxy_send_timeout    75s;
        }
    }
}
