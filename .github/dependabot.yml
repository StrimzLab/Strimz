# One grouped PR per ecosystem, so each update costs one CI run. npm is weekly;
# Go and Actions move slowly and are monthly. Security updates still arrive on their own.

version: 2
updates:
  # ─────────── npm / pnpm ───────────
  # `directories: ["/"]` plus the recursive globs lets Dependabot find
  # every workspace package.json in one shared schedule, so it groups
  # cross-workspace bumps (e.g. a Next.js minor) into a single PR.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
    labels: ['dependencies', 'npm']

  # ─────────── Go ───────────
  - package-ecosystem: gomod
    directory: /apps/indexer
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go:
        patterns: ['*']
    labels: ['dependencies', 'go']

  # ─────────── GitHub Actions ───────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies', 'ci']
