name: docker

# Builds every app's Dockerfile to make sure the image still assembles.
# Scoped narrow on purpose — only fires when a Dockerfile or the
# compose file actually changes, otherwise it's a slow tax on every
# unrelated PR.

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/tsconfig.build.json'
      - 'apps/*/nest-cli.json'
      - 'Dockerfile.lightsail'
      - 'infra/lightsail/**'
      - 'scripts/docker-smoke.sh'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/tsconfig.build.json'
      - 'apps/*/nest-cli.json'
      - 'Dockerfile.lightsail'
      - 'infra/lightsail/**'
      - 'scripts/docker-smoke.sh'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: .
            dockerfile: apps/api/Dockerfile
            smoke: true
          - app: scheduler
            context: .
            dockerfile: apps/scheduler/Dockerfile
            smoke: true
          - app: agent
            context: .
            dockerfile: apps/agent/Dockerfile
            smoke: true
          - app: indexer
            context: ./apps/indexer
            dockerfile: ./apps/indexer/Dockerfile
            smoke: false
          - app: lightsail
            context: .
            dockerfile: Dockerfile.lightsail
            smoke: lightsail
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.smoke != false }}
          tags: strimz-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Smoke (starts and reaches env validation)
        if: ${{ matrix.smoke == true }}
        run: scripts/docker-smoke.sh strimz-${{ matrix.app }}:ci

      - name: Smoke each service in the Lightsail image
        if: ${{ matrix.smoke == 'lightsail' }}
        run: |
          for app in api scheduler agent; do
            SMOKE_WORKDIR=/repo/apps/$app scripts/docker-smoke.sh strimz-lightsail:ci
          done
