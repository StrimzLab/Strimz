name: docker

# Builds every app's Dockerfile to make sure the image still assembles.
# Scoped narrow on purpose — only fires when a Dockerfile or the
# compose file actually changes, otherwise it's a slow tax on every
# unrelated PR.

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: .
            dockerfile: apps/api/Dockerfile
          - app: scheduler
            context: .
            dockerfile: apps/scheduler/Dockerfile
          - app: agent
            context: .
            dockerfile: apps/agent/Dockerfile
          - app: indexer
            context: ./apps/indexer
            dockerfile: ./apps/indexer/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: strimz-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
