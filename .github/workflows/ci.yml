name: ci

# Three parallel jobs — node, go, foundry. Splitting them keeps the
# polyglot stack honest: a Go-only change shouldn't have to wait for
# a TypeScript install, and a Solidity change shouldn't pull a Go
# toolchain. Concurrency cancels older runs on the same ref so a
# fresh push doesn't pile up minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build everything *except* @strimz/contracts — that package's
      # build script is `forge build`, and Foundry isn't installed in
      # this job. The `foundry` job builds and tests contracts on its
      # own, in parallel.
      #
      # `turbo run build` honours `^build` so every workspace that
      # imports @strimz/db gets a fresh Prisma client first.
      - name: Build (turbo, TS only)
        run: pnpm exec turbo run build --filter=!@strimz/contracts

      - name: Format check
        run: pnpm format:check

      # `lint`, `typecheck`, `test` mirror the build-step exclusion of
      # @strimz/contracts. Contracts' scripts shell out to `forge`, which
      # isn't on this runner — those tasks run in the parallel `foundry`
      # job. (`typecheck` is filtered too as a safety net even though
      # contracts has no `typecheck` script today; turbo would no-op it,
      # but the explicit filter documents intent.)
      - name: Lint
        run: pnpm exec turbo run lint --filter=!@strimz/contracts

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=!@strimz/contracts

      - name: Test
        run: pnpm exec turbo run test --filter=!@strimz/contracts

  go:
    name: go (vet · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/indexer/go.mod
          cache-dependency-path: apps/indexer/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test (unit only — e2e needs Docker)
        run: go test -count=1 -race ./internal/...

  foundry:
    name: foundry (build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # Foundry deps live as git submodules under packages/contracts/lib.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # `forge fmt --check` deliberately not run — see foundry.toml [fmt]
      # comment. The build + test pair is the load-bearing CI signal.
      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: default
