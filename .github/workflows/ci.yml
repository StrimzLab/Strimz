name: ci

# Parallel jobs (build, checks, go, foundry, e2e, release-notes) feed one aggregating
# `quality` job. A skipped job (foundry when no contract changed) counts as passed. Branch protection requires `quality` only, so jobs can be
# added or renamed without touching protection settings. Concurrency cancels
# older runs on the same ref so a fresh push doesn't pile up minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which jobs a PR needs. Pushes to main run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.diff.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed paths
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          printf '%s\n' "$changed"
          # The indexer's ABIs are checked against the contracts build, so indexer changes count.
          if printf '%s\n' "$changed" | grep -qE '^(packages/contracts/|apps/indexer/|scripts/(generate-abis|install-arc-foundry)\.sh$|\.gitmodules$|\.github/workflows/)'; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  # Production builds of every TS workspace except @strimz/contracts (its build is
  # `forge build`, which the foundry job runs). Turbo's cache is kept between runs, so
  # only workspaces whose inputs changed are rebuilt.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Next.js cache
        uses: actions/cache@v4
        with:
          path: apps/*/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (turbo, TS only)
        env:
          NEXT_PUBLIC_ARC_ENVIRONMENT: testnet
        # Two at a time: six Next.js builds at once ran the runner out of memory,
        # which GitHub reports as a cancelled job.
        run: pnpm exec turbo run build --filter=!@strimz/contracts --concurrency=2

      # The restored cache keeps old entries; drop week-old ones so it doesn't grow forever.
      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # Runs alongside `build`: lint, typecheck and test only need the shared packages
  # built (`^build`), not the Next.js apps. Tests are never cached (turbo.json), because
  # several read other workspaces' files, which turbo can't see as inputs.
  checks:
    name: checks (format · lint · typecheck · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format check
        run: pnpm format:check

      # @strimz/contracts is excluded: its scripts call `forge`, which the foundry job runs.
      - name: Lint, typecheck and test
        env:
          NEXT_PUBLIC_ARC_ENVIRONMENT: testnet
        run: pnpm exec turbo run lint typecheck test --filter=!@strimz/contracts --concurrency=4

      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  go:
    name: go (vet · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/indexer/go.mod
          cache-dependency-path: apps/indexer/go.sum

      - name: Format (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test (unit only — e2e needs Docker)
        run: go test -count=1 -race ./internal/...

  foundry:
    name: foundry (build · test)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
        with:
          # Foundry deps live as git submodules under packages/contracts/lib.
          submodules: recursive

      - name: Install Arc Foundry (pinned)
        working-directory: .
        run: |
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install contracts tooling
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @strimz/contracts

      # `forge fmt --check` deliberately not run — see foundry.toml [fmt]
      # comment. The build + test pair is the load-bearing CI signal.
      - name: Build
        run: arc-forge build --sizes

      # Only this job has the build output the indexer ABIs come from.
      - name: Indexer ABIs match the build
        working-directory: .
        run: scripts/generate-abis.sh --check

      - name: Test
        run: arc-forge test --network arc -vvv
        env:
          FOUNDRY_PROFILE: default

      - name: Fork tests (Arc testnet)
        run: arc-forge test --network arc -vvv
        env:
          FOUNDRY_PROFILE: fork
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.io

  e2e:
    name: e2e (api · scheduler · agent · indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/indexer/go.mod
          cache-dependency-path: apps/indexer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=@strimz/api^... --filter=@strimz/scheduler^... --filter=@strimz/agent^...

      - name: API e2e
        run: pnpm --filter @strimz/api test:e2e

      - name: Scheduler e2e
        run: pnpm --filter @strimz/scheduler test:e2e

      - name: Agent e2e
        run: pnpm --filter @strimz/agent test:e2e

      - name: Indexer store e2e
        run: pnpm --filter @strimz/indexer test:e2e

  release-notes:
    name: release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # check_release_notes.sh diffs the PR against its base.
          fetch-depth: 0

      - name: Release Notes Governance Gate
        run: STRICT_RELEASE_NOTES=true bash scripts/check_release_notes.sh

  # Not in quality's needs on purpose: it forks public Arc testnet, so an Arc outage
  # can fail it with nothing wrong in the PR. See docs/plans/2026-11-12-full-stack-e2e-plan.md.
  e2e-full-stack:
    name: e2e full stack (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
      ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.io
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Arc Foundry (pinned)
        run: |
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/indexer/go.mod
          cache-dependency-path: apps/indexer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the services under test
        run: pnpm exec turbo run build --filter=@strimz/api --filter=@strimz/scheduler --filter=@strimz/indexer

      - name: Full-stack e2e
        run: pnpm --filter @strimz/e2e-full-stack test:e2e

      - name: Service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-stack-logs
          path: e2e/full-stack/.logs/
          # The folder name starts with a dot, which upload-artifact skips by default.
          include-hidden-files: true

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [changes, build, checks, go, foundry, e2e, release-notes]
    if: always()
    steps:
      - name: Every gate passed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          echo ok
