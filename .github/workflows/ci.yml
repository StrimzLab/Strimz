name: ci

# Parallel jobs (node, go, foundry, release-notes) feed one aggregating
# `quality` job. Branch protection requires `quality` only, so jobs can be
# added or renamed without touching protection settings. Concurrency cancels
# older runs on the same ref so a fresh push doesn't pile up minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build everything *except* @strimz/contracts — that package's
      # build script is `forge build`, and Foundry isn't installed in
      # this job. The `foundry` job builds and tests contracts on its
      # own, in parallel.
      #
      # `turbo run build` honours `^build` so every workspace that
      # imports @strimz/db gets a fresh Prisma client first.
      - name: Build (turbo, TS only)
        run: pnpm exec turbo run build --filter=!@strimz/contracts

      - name: Format check
        run: pnpm format:check

      # `lint`, `typecheck`, `test` mirror the build-step exclusion of
      # @strimz/contracts. Contracts' scripts shell out to `forge`, which
      # isn't on this runner — those tasks run in the parallel `foundry`
      # job. (`typecheck` is filtered too as a safety net even though
      # contracts has no `typecheck` script today; turbo would no-op it,
      # but the explicit filter documents intent.)
      - name: Lint
        run: pnpm exec turbo run lint --filter=!@strimz/contracts

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=!@strimz/contracts

      - name: Test
        run: pnpm exec turbo run test --filter=!@strimz/contracts

  go:
    name: go (vet · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/indexer/go.mod
          cache-dependency-path: apps/indexer/go.sum

      - name: Format (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test (unit only — e2e needs Docker)
        run: go test -count=1 -race ./internal/...

  foundry:
    name: foundry (build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # Foundry deps live as git submodules under packages/contracts/lib.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # `forge fmt --check` deliberately not run — see foundry.toml [fmt]
      # comment. The build + test pair is the load-bearing CI signal.
      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: default

  e2e:
    name: e2e (api · scheduler · agent · indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/indexer/go.mod
          cache-dependency-path: apps/indexer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=@strimz/api^... --filter=@strimz/scheduler^... --filter=@strimz/agent^...

      - name: API e2e
        run: pnpm --filter @strimz/api test:e2e

      - name: Scheduler e2e
        run: pnpm --filter @strimz/scheduler test:e2e

      - name: Agent e2e
        run: pnpm --filter @strimz/agent test:e2e

      - name: Indexer store e2e
        run: pnpm --filter @strimz/indexer test:e2e

  release-notes:
    name: release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # check_release_notes.sh diffs the PR against its base.
          fetch-depth: 0

      - name: Release Notes Governance Gate
        run: STRICT_RELEASE_NOTES=true bash scripts/check_release_notes.sh

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [node, go, foundry, e2e, release-notes]
    if: always()
    steps:
      - name: Every gate passed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          echo ok
