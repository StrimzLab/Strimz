[package]
name = "strimz-fee-collector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Strimz protocol fee collector — admin-controlled withdrawal of accrued fees on Soroban."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
