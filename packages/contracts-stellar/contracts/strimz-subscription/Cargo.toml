[package]
name = "strimz-subscription"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Strimz recurring subscriptions — payer-approved SEP-41 allowance, idempotent merchant-initiated charges on Soroban."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
