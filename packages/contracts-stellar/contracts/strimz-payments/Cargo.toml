[package]
name = "strimz-payments"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Strimz one-shot payments — payer-authorised USDC transfer with atomic fee split on Soroban."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
