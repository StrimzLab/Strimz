[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# Tuned for a system that will execute payments/subscriptions millions of
# times over the contract's lifetime. Prioritise runtime gas over deploy cost.
optimizer_runs = 1_000_000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" }
]
# Required by openzeppelin-foundry-upgrades: it shells out to a Node-based
# validator to check storage-layout safety on every deploy / upgrade.
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 128 }
verbosity = 3

[profile.lite]
optimizer = false
via_ir = false

[fmt]
# `forge fmt` is opinionated and reformats away from the project's
# preferred multi-line style for storage slots, function signatures
# with many params, and view-getter one-liners — so CI does not run
# `forge fmt --check`. These settings are kept only as a hint for
# anyone invoking `forge fmt` by hand.
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
